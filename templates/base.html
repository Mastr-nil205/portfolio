<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} — Luigi Josue</title>
  <meta name="description" content="{{ description }}">
  <meta name="theme-color" content="#101923">
  {% if canonical %}<link rel="canonical" href="{{ canonical }}">{% endif %}
  {% if noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <meta property="og:title" content="{{ title }} — Luigi Josue">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Luigi Josue">
  {% if canonical %}<meta property="og:url" content="{{ canonical }}">{% endif %}
  {% if site_url %}<meta property="og:image" content="{{ site_url }}{{ asset_url('images/social-card.png') }}">{% endif %}
  <meta property="og:image:alt" content="Luigi Josue — IT professional and technical builder">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="{{ asset_url('favicon.svg') }}">
  <link rel="stylesheet" href="{{ asset_url('vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ asset_url('css/fonts.css') }}">
  <link rel="stylesheet" href="{{ asset_url('css/tokens.css') }}">
  <link rel="stylesheet" href="{{ asset_url('css/styles.css') }}">
  <link rel="stylesheet" href="{{ asset_url('css/components.css') }}">
  <script type="module" src="{{ asset_url('js/main.js') }}"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include 'components/header.html' %}
  <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
  {% include 'components/footer.html' %}
</body>
</html>
