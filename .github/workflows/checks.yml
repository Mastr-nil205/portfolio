name: Portfolio checks

on:
  push:
    branches: [rebuild/portfolio]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test application, content, and HTML
        run: python -m pytest -q
      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < public/js/main.js
          node --input-type=module --check < public/js/navigation.js
      - name: Prepare local release package
        run: python scripts/stage_release.py
